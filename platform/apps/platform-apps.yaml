apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: open-horizons-platform

spec:
  description: "Open Horizons Platform Components"

  # Source repositories
  sourceRepos:
    - https://github.com/SuraOhorizons/ohorizons-mvp.git
    - https://charts.jetstack.io
    - https://kubernetes.github.io/ingress-nginx
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://jaegertracing.github.io/helm-charts
    - https://charts.bitnami.com/bitnami
    - registry-1.docker.io

  # Destination clusters and namespaces
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc

  # Cluster resources the project can manage
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

    - group: ""
      kind: PersistentVolume

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

    - group: networking.k8s.io
      kind: IngressClass

    - group: storage.k8s.io
      kind: StorageClass

    - group: cert-manager.io
      kind: ClusterIssuer

    - group: monitoring.coreos.com
      kind: "*"

    - group: external-secrets.io
      kind: ClusterSecretStore

  # Namespace-scoped resources
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Roles for project members
  roles:
    - name: platform-admin
      description: "Full access to platform project"
      policies:
        - p, proj:platform:platform-admin, applications, *, platform/*, allow
        - p, proj:platform:platform-admin, repositories, *, platform/*, allow
      groups:
        - platform-admins

    - name: platform-viewer
      description: "Read-only access to platform project"
      policies:
        - p, proj:platform:platform-viewer, applications, get, platform/*, allow
      groups:
        - platform-viewers

---
# =============================================================================
# WAVE 0: EXTERNAL SECRETS
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: platform

  source:
    repoURL: https://github.com/SuraOhorizons/ohorizons-mvp.git
    targetRevision: main
    path: platform/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true

---
# =============================================================================
# WAVE 1: CERT-MANAGER
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: platform

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.14.0

    helm:
      values: |
        installCRDs: true

        global:
          leaderElection:
            namespace: cert-manager

        replicaCount: 2

        podDisruptionBudget:
          enabled: true
          minAvailable: 1

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

        prometheus:
          enabled: true
          servicemonitor:
            enabled: true

        webhook:
          replicaCount: 2

        cainjector:
          replicaCount: 2

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
# =============================================================================
# WAVE 2: INGRESS-NGINX
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: platform

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.9.0

    helm:
      values: |
        controller:
          replicaCount: 2

          service:
            annotations:
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 10
            targetCPUUtilizationPercentage: 80

          podDisruptionBudget:
            enabled: true
            minAvailable: 1

          metrics:
            enabled: true
            serviceMonitor:
              enabled: true

          admissionWebhooks:
            enabled: true

          config:
            use-forwarded-headers: "true"
            compute-full-forwarded-for: "true"
            use-proxy-protocol: "false"

        defaultBackend:
          enabled: true
          replicaCount: 2

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

---
# =============================================================================
# WAVE 3: BACKSTAGE
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: platform

  source:
    repoURL: https://github.com/SuraOhorizons/ohorizons-mvp.git
    targetRevision: main
    path: platform/backstage

  destination:
    server: https://kubernetes.default.svc
    namespace: backstage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
