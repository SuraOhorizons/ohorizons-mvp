# =============================================================================
# OPEN HORIZONS PLATFORM - H1 AGENT API GOLDEN PATH TEMPLATE
# =============================================================================
#
# Backstage Software Template que genera el backend del "AI Chat" integrado
# de Backstage (sidebar "Intelligence"). El frontend (plugin ai-chat) ya viene
# incluido en la imagen de Backstage — este golden path solo genera el
# backend (agent-api) que le falta para funcionar: build + push a ACR y
# despliegue vía ArgoCD.
#
# Ambiente objetivo: SuraOhorizons (ambiente 1). Componente de plataforma,
# normalmente se instancia una sola vez (o una por ambiente), no por cada
# desarrollador.
#
# =============================================================================

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: h1-agent-api
  title: "H1: Agent API (Backend del AI Chat de Backstage)"
  description: >
    Genera el backend multi-agente (FastAPI + Azure OpenAI) que necesita el
    AI Chat integrado de Backstage para funcionar, publica el repo en GitHub,
    incluye el workflow de CI/CD (build + push a ACR) y los manifiestos de
    despliegue para ArgoCD/AKS, y registra el componente en el catálogo.
  tags:
    - h1-foundation
    - python
    - fastapi
    - azure-openai
    - ai-chat
    - platform
  annotations:
    backstage.io/techdocs-ref: dir:.

spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: Datos del proyecto
      required:
        - name
        - owner
      properties:
        name:
          title: Nombre del proyecto
          type: string
          description: Se usa como nombre del repo nuevo en GitHub y de los recursos en Kubernetes
          default: agent-api
        description:
          title: Descripción
          type: string
          default: Backend multi-agente del AI Chat de Backstage
        owner:
          title: Owner
          type: string
          description: Equipo o persona dueña del componente (se guarda en catalog-info.yaml)
          default: platform-engineering

    - title: CI/CD y despliegue
      required:
        - registry
        - namespace
      properties:
        registry:
          title: Container Registry
          type: string
          description: Registro donde CI publica la imagen (ej. crsuradev.azurecr.io)
          default: crsuradev.azurecr.io
        namespace:
          title: Kubernetes Namespace
          type: string
          description: Namespace de AKS donde ArgoCD despliega el servicio
          default: ai-services
        system:
          title: System
          type: string
          description: Sistema al que pertenece este servicio (etiqueta app.kubernetes.io/part-of)
          default: openhorizons-demo
        allowedOrigin:
          title: CORS Allowed Origin
          type: string
          description: Origen(es) permitidos para llamadas desde el frontend de Backstage
          default: "*"

    - title: Azure OpenAI
      required:
        - azureOpenAIDeployment
        - azureOpenAIEndpointSecretKey
        - azureOpenAIApiKeySecretKey
      properties:
        azureOpenAIDeployment:
          title: Nombre del deployment de Azure OpenAI
          type: string
          description: El nombre del modelo publicado en tu recurso Azure OpenAI
          default: gpt-5-1
        azureOpenAIEndpointSecretKey:
          title: Secreto en Key Vault — Endpoint
          type: string
          description: Nombre del secreto en Key Vault con el endpoint de Azure OpenAI
          default: AzureOpenAIEndpoint
        azureOpenAIApiKeySecretKey:
          title: Secreto en Key Vault — API Key
          type: string
          description: Nombre del secreto en Key Vault con la API key de Azure OpenAI
          default: AzureOpenAIApiKey
        githubTokenSecretKey:
          title: Secreto en Key Vault — GitHub Token
          type: string
          description: Nombre del secreto en Key Vault con el token para que los agentes llamen a la API de GitHub
          default: GithubToken
        githubOwner:
          title: Organización de GitHub a consultar
          type: string
          description: >-
            Organización/owner que los agentes (@pipeline, @sentinel, @compass)
            consultan al llamar a la API de GitHub. El default del código
            (sin esta variable) apunta al proyecto open-source original
            ("Ohorizons"), no a tu organización real.
          default: SuraOhorizons

  # ===========================================================================
  # STEPS
  # ===========================================================================

  steps:
    - id: fetch-app
      name: Copiar código de la aplicación
      action: fetch:template
      input:
        url: ./skeleton/app
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.namespace }}

    - id: fetch-ci
      name: Copiar workflow de CI/CD
      action: fetch:template
      input:
        url: ./skeleton/.github
        targetPath: ./.github
        values:
          name: ${{ parameters.name }}
          registry: ${{ parameters.registry }}

    - id: fetch-deploy
      name: Copiar manifiestos de despliegue
      action: fetch:template
      input:
        url: ./skeleton/deploy
        targetPath: ./deploy
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          system: ${{ parameters.system }}
          registry: ${{ parameters.registry }}
          allowedOrigin: ${{ parameters.allowedOrigin }}
          githubOwner: ${{ parameters.githubOwner }}
          azureOpenAIDeployment: ${{ parameters.azureOpenAIDeployment }}
          azureOpenAIEndpointSecretKey: ${{ parameters.azureOpenAIEndpointSecretKey }}
          azureOpenAIApiKeySecretKey: ${{ parameters.azureOpenAIApiKeySecretKey }}
          githubTokenSecretKey: ${{ parameters.githubTokenSecretKey }}

    - id: publish
      name: Publicar en GitHub
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.name }}&owner=SuraOhorizons
        description: ${{ parameters.description }}
        repoVisibility: public
        defaultBranch: main
        collaborators:
          - user: ramisistemas
            access: push

    - id: register
      name: Registrar en el catálogo
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repositorio en GitHub
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Abrir en el catálogo
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: Backend del AI Chat creado
        content: |
          ## 🤖 Repositorio de `agent-api` creado

          **Nombre:** ${{ parameters.name }}
          **Namespace:** ${{ parameters.namespace }}

          **Siguientes pasos:**
          1. Cargar en Key Vault los 3 secretos: `${{ parameters.azureOpenAIEndpointSecretKey }}`, `${{ parameters.azureOpenAIApiKeySecretKey }}`, `${{ parameters.githubTokenSecretKey }}`
          2. Confirmar que los secrets `AZURE_CLIENT_ID`/`AZURE_CLIENT_SECRET` de la organización llegan a este repo (mismos que usa `tasks-api-v2`)
          3. Hacer merge a `main` para disparar el build + push a ACR
          4. Sincronizar la `Application` de ArgoCD (`deploy/argocd/application.yaml`)
          5. Ajustar el proxy `/agent-api` en `app-config.production.yaml` de Backstage para que apunte a `http://${{ parameters.name }}.${{ parameters.namespace }}.svc.cluster.local:8008`
          6. Confirmar en Backstage → Intelligence → AI Chat que el warning "Agent backend is not reachable" desaparece
